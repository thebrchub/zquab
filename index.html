<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    
    <!-- Primary Meta Tags -->
    <title>zQuab</title>
    <meta name="title" content="Meet someone new in seconds.">

    <meta name="theme-color" content="#09090B" />

    <!-- TEMPORARY: Block Search Engine Indexing -->
    <meta name="robots" content="noindex, nofollow">
    <meta name="googlebot" content="noindex, nofollow">

    <!-- Open Graph / Facebook / Discord / WhatsApp -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://www.zquab.com/">

    <meta property="og:image" content="https://www.zquab.com/og-image.jpg">

    <!-- Twitter / X -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://www.zquab.com/">
    <meta property="twitter:title" content="Meet someone new in seconds.">
    <meta property="twitter:description" content="Chat instantly with strangers around the world. No signup. No downloads. Just real conversations.">

    <meta property="twitter:image" content="https://www.zquab.com/og-image.jpg">
