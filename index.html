<!doctype html>
<html lang="en" class="dark">
  <head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-K6188DLV71"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-K6188DLV71');
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content" />
    
    <!-- Bulletproof Anti-FOUC (Flash of Unstyled Content) -->
    <style>
      /* Hardcode the base colors so they paint instantly before React/Tailwind even wake up */
      html { background-color: #09090B; color: #FAFAFA; }
      html.light { background-color: #F8FAFC; color: #111827; }
    </style>
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('theme');
          // If they explicitly saved light mode, switch to it. Otherwise, force dark.
          if (savedTheme === 'light') {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
    
    <!-- Primary Meta Tags -->
    <title>zQuab | Meet someone new in seconds.</title>
    <meta name="title" content="zQuab — Meet someone new in seconds." />
    <meta name="description" content="Chat instantly with strangers around the world. No signup. No downloads. Just real conversations." />
    <meta name="theme-color" content="#09090B" />
    
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://www.zquab.com/" />

    <!-- Favicon & App Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- TEMPORARY: Block Search Engine Indexing (Remove before launch!) -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="googlebot" content="noindex, nofollow" />

    <!-- Open Graph / Facebook / Discord / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.zquab.com/" />
    <meta property="og:title" content="zQuab — Meet someone new in seconds." />
    <meta property="og:description" content="Chat instantly with strangers around the world. No signup. No downloads. Just real conversations." />
    <meta property="og:image" content="https://www.zquab.com/og-image.jpg" />
    <meta property="og:site_name" content="zQuab" />

    <!-- Twitter / X -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://www.zquab.com/" />
    <meta property="twitter:title" content="zQuab — Meet someone new in seconds." />
    <meta property="twitter:description" content="Chat instantly with strangers around the world. No signup. No downloads. Just real conversations." />
    <meta property="twitter:image" content="https://www.zquab.com/og-image.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
