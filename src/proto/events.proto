syntax = "proto3";
package eventspb;

message MatchFound {
    string room_id          = 1;
    string partner_id       = 2;
    string partner_avatar   = 3;
    string partner_location = 4;
    string partner_username = 5;
    bool   is_friend        = 6; // Indicates whether the matched stranger is already a friend
}

message StrangerDisconnected {
    string room_id = 1;
}

// MsgType "friend_accepted" — sent to both users when a mutual add-friend
// during a stranger match succeeds; dm_room_id is the new permanent DM room.
message FriendAccepted {
    string room_id    = 1;
    string dm_room_id = 2;
}

// MsgType "friend_request" — one-sided: partner wants to be friends, waiting
// on you to reciprocate (room_id set when this originates from a stranger match).
message FriendRequest {
    string from     = 1;
    string room_id  = 2;
    string username = 3;
}

// Stranger photo sharing (request/approve, relay-free — the actual bytes go
// direct client<->R2 via presigned URLs, never through the backend).

// MsgType "photo_request"
message PhotoRequest {
    string room_id = 1;
    string from    = 2; // requester userID
}

// MsgType "photo_response"
message PhotoResponse {
    string room_id  = 1;
    string from     = 2; // responder userID
    bool   accepted = 3;
}

// MsgType "photo_ready"
message PhotoReady {
    string room_id    = 1;
    string from       = 2; // uploader userID
    string url        = 3; // presigned GET URL, short-lived
    int64  expires_at = 4; // epoch ms when the URL/object expires
}
